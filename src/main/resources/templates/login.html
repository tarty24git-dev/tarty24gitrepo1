<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${appName} + ' - Login'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e293b, #0f172a); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { width: 100%; max-width: 420px; border: none; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .card-header { background: #2563eb; color: white; border-top-left-radius: 12px !important; border-top-right-radius: 12px !important; text-align: center; padding: 20px; }
    </style>
</head>
<body>
<div class="card login-card">
    <div class="card-header">
        <h4 class="mb-0" th:text="${appName}">Application Name</h4>
        <small class="text-light opacity-75" th:text="'Auth Mode: ' + ${authMode}">LOCAL</small>
    </div>
    <div class="card-body p-4">
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${logoutMessage}" class="alert alert-success" th:text="${logoutMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
        </form>
        <div class="mt-3 text-center">
            <a th:href="@{/register}" class="text-decoration-none">Don't have an account? Register here</a>
        </div>
    </div>
</div>
</body>
</html>
