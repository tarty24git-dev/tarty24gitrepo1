<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${appName} + ' - Online Reports'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background-color: #0f172a; color: white; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 12px 20px; display: block; border-radius: 6px; margin-bottom: 4px; }
        .sidebar a:hover, .sidebar a.active { background-color: #1e293b; color: #38bdf8; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-md-2 sidebar p-3">
            <h4 class="text-white mb-4 ps-2" th:text="${appName}">Application</h4>
            <a href="/dashboard"><i class="bi bi-speedometer2 me-2"></i> Realtime Dashboard</a>
            <a href="/users"><i class="bi bi-people me-2"></i> User Maintenance</a>
            <a href="/db-explorer"><i class="bi bi-database me-2"></i> Database Explorer</a>
            <a href="/reports" class="active"><i class="bi bi-file-earmark-bar-graph me-2"></i> Online Reports</a>
            <a href="/swagger-ui.html" target="_blank"><i class="bi bi-code-square me-2"></i> Swagger API Docs</a>
            <a href="/settings"><i class="bi bi-gear me-2"></i> System Settings</a>
            <div class="mt-5 ps-2">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-danger btn-sm w-100"><i class="bi bi-box-arrow-right me-1"></i> Sign Out</button>
                </form>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Configurable Online Reports</h2>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#newReportModal"><i class="bi bi-plus-circle me-1"></i> Build Custom Report</button>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row">
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm p-3">
                        <h5 class="card-title mb-3"><i class="bi bi-journal-text me-2"></i> Saved Reports</h5>
                        <div class="list-group list-group-flush">
                            <a th:each="r : ${reports}" th:href="@{'/reports?reportId=' + ${r.id}}"
                               class="list-group-item list-group-item-action"
                               th:classappend="${selectedReport != null and selectedReport.id == r.id ? 'active fw-bold' : ''}">
                                <div class="d-flex w-100 justify-content-between">
                                    <h6 class="mb-1" th:text="${r.reportName}">Report Name</h6>
                                </div>
                                <small th:text="${r.description}">Description</small>
                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <div th:if="${selectedReport}" class="card border-0 shadow-sm p-3">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="text-primary mb-0" th:text="${selectedReport.reportName}">Report Name</h4>
                            <a th:href="@{'/reports/' + ${selectedReport.id} + '/export-csv'}" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-download me-1"></i> Export CSV
                            </a>
                        </div>
                        <p class="text-muted" th:text="${selectedReport.description}"></p>
                        <div class="bg-light p-2 rounded mb-3">
                            <small class="text-monospace text-dark"><strong>SQL:</strong> <span th:text="${selectedReport.querySql}"></span></small>
                        </div>

                        <div th:if="${reportData}" class="table-responsive" style="max-height: 450px; overflow-y: auto;">
                            <table class="table table-hover border">
                                <thead class="table-dark">
                                    <tr>
                                        <th th:each="key : ${reportData[0].keySet()}" th:text="${key}">Key</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="row : ${reportData}">
                                        <td th:each="val : ${row.values()}" th:text="${val}">Val</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal to Build Custom Report -->
<div class="modal fade" id="newReportModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form th:action="@{/reports/save}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Configure New Online Report</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Report Name</label>
                        <input type="text" name="reportName" class="form-control" required placeholder="e.g. Locked Users Summary">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input type="text" name="description" class="form-control" placeholder="Short report description">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Target Table</label>
                        <input type="text" name="targetTable" class="form-control" placeholder="cth_users">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">SQL Query (SELECT only)</label>
                        <textarea name="querySql" class="form-control" rows="4" required placeholder="SELECT username, email, failed_attempt FROM cth_users WHERE account_non_locked = false"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Save Report Config</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
