<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${appName} + ' - Account Registration'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e293b, #0f172a); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .reg-card { width: 100%; max-width: 500px; border: none; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .card-header { background: #059669; color: white; border-top-left-radius: 12px !important; border-top-right-radius: 12px !important; text-align: center; padding: 20px; }
    </style>
</head>
<body>
<div class="card reg-card">
    <div class="card-header">
        <h4 class="mb-0">Create New Account</h4>
        <small class="text-light opacity-75" th:text="${appName}"></small>
    </div>
    <div class="card-body p-4">
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="e.g. jdoe" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="fullName" class="form-control" placeholder="e.g. John Doe" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="john.doe@cth.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone Number (for SMS/MFA)</label>
                <input type="text" name="phone" class="form-control" placeholder="+1234567890">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div th:if="${mfaEnabled}" class="alert alert-info">
                <small><strong>Notice:</strong> SMS/Email authentication notification toggle is <strong>ENABLED</strong>. A verification OTP code will be sent to your phone/email upon registration.</small>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2">Register Account</button>
        </form>
        <div class="mt-3 text-center">
            <a th:href="@{/login}" class="text-decoration-none">Already have an account? Sign In</a>
        </div>
    </div>
</div>
</body>
</html>
