# Primary application configuration
spring.application.name=${app.name:Enterprise Management App}

# Default Database Settings (H2 embedded for immediate out-of-the-box run, easily configurable to Oracle / Postgres / SQL Server)
spring.datasource.url=${db.url:jdbc:h2:mem:cthdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${db.username:sa}
spring.datasource.password=${db.password:}
spring.datasource.driver-class-name=${db.driver:org.h2.Driver}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Custom dynamic configuration properties defaults
app.name=Enterprise Dynamic Application
app.auth.mode=LOCAL
app.auth.ldap.url=ldap://localhost:389
app.auth.ldap.base-dn=dc=example,dc=com
app.auth.ldap.user-dn-pattern=uid={0},ou=people
app.security.mfa.enabled=false
app.security.password.expiration-days=90
app.security.max-failed-attempts=5
